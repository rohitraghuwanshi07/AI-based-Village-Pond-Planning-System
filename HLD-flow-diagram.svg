<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="1100" fill="white"/>

  <!-- Title -->
  <text x="425" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2a24">AI-Based Village Pond Planning System</text>
  <text x="425" y="78" text-anchor="middle" font-size="16" fill="#4a5a4f">System Architecture &amp; Data Flow</text>

  <!-- ===== FRONTEND BOX ===== -->
  <rect x="175" y="110" width="500" height="90" rx="12" fill="#eaf2e8" stroke="#2c5a3d" stroke-width="2.5"/>
  <text x="425" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5a3d">FRONTEND</text>
  <text x="425" y="165" text-anchor="middle" font-size="15" fill="#1f2a24">Leaflet.js Map + HTML / CSS / JavaScript</text>
  <text x="425" y="186" text-anchor="middle" font-size="13" fill="#4a5a4f">Village search, satellite/contour layers, click-to-analyze, results panel</text>

  <!-- Arrow down -->
  <line x1="425" y1="200" x2="425" y2="235" stroke="#2c5a3d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="222" font-size="13" fill="#4a5a4f">REST API (JSON)</text>

  <!-- ===== BACKEND BOX ===== -->
  <rect x="100" y="240" width="650" height="330" rx="12" fill="#eaf0f8" stroke="#2c4f7a" stroke-width="2.5"/>
  <text x="425" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c4f7a">BACKEND — FastAPI (Python)</text>

  <!-- Module boxes row 1 -->
  <rect x="130" y="290" width="180" height="70" rx="8" fill="white" stroke="#2c4f7a" stroke-width="1.5"/>
  <text x="220" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a24">1. Village Search</text>
  <text x="220" y="336" text-anchor="middle" font-size="11" fill="#4a5a4f">Geocode place name</text>
  <text x="220" y="350" text-anchor="middle" font-size="11" fill="#4a5a4f">to lat / lon</text>

  <rect x="335" y="290" width="180" height="70" rx="8" fill="white" stroke="#2c4f7a" stroke-width="1.5"/>
  <text x="425" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a24">2. Terrain Analysis</text>
  <text x="425" y="336" text-anchor="middle" font-size="11" fill="#4a5a4f">Slope + contour lines</text>
  <text x="425" y="350" text-anchor="middle" font-size="11" fill="#4a5a4f">from elevation data</text>

  <rect x="540" y="290" width="180" height="70" rx="8" fill="white" stroke="#2c4f7a" stroke-width="1.5"/>
  <text x="630" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a24">3. Rainfall Fetch</text>
  <text x="630" y="336" text-anchor="middle" font-size="11" fill="#4a5a4f">Historical daily</text>
  <text x="630" y="350" text-anchor="middle" font-size="11" fill="#4a5a4f">rainfall, 10 years</text>

  <!-- Arrow between row1 and row2 -->
  <line x1="425" y1="360" x2="425" y2="390" stroke="#2c4f7a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Module boxes row 2 -->
  <rect x="180" y="395" width="220" height="70" rx="8" fill="white" stroke="#2c4f7a" stroke-width="1.5"/>
  <text x="290" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a24">4. Catchment Delineation</text>
  <text x="290" y="441" text-anchor="middle" font-size="11" fill="#4a5a4f">D8 flow direction +</text>
  <text x="290" y="455" text-anchor="middle" font-size="11" fill="#4a5a4f">accumulation algorithm</text>

  <rect x="450" y="395" width="220" height="70" rx="8" fill="white" stroke="#2c4f7a" stroke-width="1.5"/>
  <text x="560" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a24">5. Runoff + Pond Sizing</text>
  <text x="560" y="441" text-anchor="middle" font-size="11" fill="#4a5a4f">SCS Curve Number +</text>
  <text x="560" y="455" text-anchor="middle" font-size="11" fill="#4a5a4f">trapezoidal volume formula</text>

  <!-- Combined output box -->
  <line x1="290" y1="465" x2="425" y2="495" stroke="#2c4f7a" stroke-width="2"/>
  <line x1="560" y1="465" x2="425" y2="495" stroke="#2c4f7a" stroke-width="2"/>
  <rect x="255" y="498" width="340" height="55" rx="8" fill="white" stroke="#2c4f7a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="425" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a24">Combined Result</text>
  <text x="425" y="538" text-anchor="middle" font-size="11" fill="#4a5a4f">/api/pond/recommend — single JSON response</text>

  <!-- Arrow down to external -->
  <line x1="425" y1="570" x2="290" y2="610" stroke="#7a4a2c" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="240" y="595" font-size="12" fill="#4a5a4f">reads external data</text>

  <line x1="425" y1="570" x2="590" y2="610" stroke="#5a3d7a" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <text x="595" y="595" font-size="12" fill="#4a5a4f">stores / caches</text>

  <!-- ===== EXTERNAL DATA SOURCES BOX (left column) ===== -->
  <rect x="100" y="615" width="330" height="115" rx="12" fill="#f8f0e8" stroke="#7a4a2c" stroke-width="2.5"/>
  <text x="265" y="642" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4a2c">EXTERNAL FREE APIs</text>
  <text x="265" y="665" text-anchor="middle" font-size="12.5" fill="#1f2a24">Open-Meteo — geocoding +</text>
  <text x="265" y="682" text-anchor="middle" font-size="12.5" fill="#1f2a24">historical rainfall (no key)</text>
  <text x="265" y="702" text-anchor="middle" font-size="12.5" fill="#1f2a24">OpenTopography — SRTM</text>
  <text x="265" y="719" text-anchor="middle" font-size="12.5" fill="#1f2a24">elevation data (free key)</text>

  <!-- ===== DATABASE BOX (right column) ===== -->
  <rect x="450" y="615" width="300" height="115" rx="12" fill="#f0eaf8" stroke="#5a3d7a" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="600" y="642" text-anchor="middle" font-size="16" font-weight="bold" fill="#5a3d7a">DATABASE (Planned)</text>
  <text x="600" y="665" text-anchor="middle" font-size="12.5" fill="#1f2a24">PostgreSQL + PostGIS</text>
  <text x="600" y="686" text-anchor="middle" font-size="11.5" fill="#4a5a4f">Cache: DEM tiles, rainfall,</text>
  <text x="600" y="702" text-anchor="middle" font-size="11.5" fill="#4a5a4f">computed catchments,</text>
  <text x="600" y="718" text-anchor="middle" font-size="11.5" fill="#4a5a4f">saved pond recommendations</text>

  <!-- Arrow back up (dashed, response) -->
  <line x1="770" y1="615" x2="770" y2="240" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="770" y1="240" x2="675" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowgrey)"/>
  <text x="800" y="430" font-size="12" fill="#666" transform="rotate(90 800 430)" text-anchor="middle">data returned</text>

  <!-- ===== WORKFLOW STEPS ===== -->
  <text x="425" y="770" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a24">Project Workflow</text>

  <g font-size="13" fill="#1f2a24">
    <circle cx="90" cy="810" r="16" fill="#2c5a3d"/>
    <text x="90" y="815" text-anchor="middle" fill="white" font-weight="bold">1</text>
    <text x="115" y="815">Search village name</text>

    <circle cx="90" cy="850" r="16" fill="#2c5a3d"/>
    <text x="90" y="855" text-anchor="middle" fill="white" font-weight="bold">2</text>
    <text x="115" y="855">View satellite map + contour lines</text>

    <circle cx="90" cy="890" r="16" fill="#2c5a3d"/>
    <text x="90" y="895" text-anchor="middle" fill="white" font-weight="bold">3</text>
    <text x="115" y="895">Click a candidate pond site on the map</text>

    <circle cx="90" cy="930" r="16" fill="#2c5a3d"/>
    <text x="90" y="935" text-anchor="middle" fill="white" font-weight="bold">4</text>
    <text x="115" y="935">System computes catchment area, rainfall, runoff volume</text>

    <circle cx="90" cy="970" r="16" fill="#2c5a3d"/>
    <text x="90" y="975" text-anchor="middle" fill="white" font-weight="bold">5</text>
    <text x="115" y="975">System recommends pond depth, area, and storage capacity</text>

    <circle cx="90" cy="1010" r="16" fill="#2c5a3d"/>
    <text x="90" y="1015" text-anchor="middle" fill="white" font-weight="bold">6</text>
    <text x="115" y="1015">Results overlaid together on the map + results panel</text>
  </g>

  <!-- connecting line for steps -->
  <line x1="90" y1="826" x2="90" y2="834" stroke="#2c5a3d" stroke-width="2"/>
  <line x1="90" y1="866" x2="90" y2="874" stroke="#2c5a3d" stroke-width="2"/>
  <line x1="90" y1="906" x2="90" y2="914" stroke="#2c5a3d" stroke-width="2"/>
  <line x1="90" y1="946" x2="90" y2="954" stroke="#2c5a3d" stroke-width="2"/>
  <line x1="90" y1="986" x2="90" y2="994" stroke="#2c5a3d" stroke-width="2"/>

  <!-- Footer -->
  <text x="425" y="1070" text-anchor="middle" font-size="12" fill="#888">All components use free / open-source tools and free-tier public APIs</text>

  <!-- Arrow marker defs -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2c5a3d"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2c4f7a"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7a4a2c"/>
    </marker>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a3d7a"/>
    </marker>
    <marker id="arrowgrey" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
